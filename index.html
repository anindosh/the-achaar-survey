<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>The Achaar Survey</title>
  <meta name="description" content="We're cooking something up. But first, we want to hear from you.">
  <meta name="theme-color" content="#A81A1A">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage" id="stage">

    <!-- HOME -->
    <section class="view view--home is-active" id="home" aria-labelledby="home-title">
      <img class="deco deco--chillies" src="assets/survey-2.svg" alt="" aria-hidden="true">
      <img class="deco deco--note" src="assets/garam-masala.svg" alt="" aria-hidden="true">
      <img class="deco deco--bowl" src="assets/survey-4.svg" alt="" aria-hidden="true">
      <img class="deco deco--jar" src="assets/survey-3.svg" alt="" aria-hidden="true">
      <img class="deco deco--nani" src="assets/grandma.svg" alt="" aria-hidden="true">
      <img class="deco deco--tomatoes" src="assets/survey-5.svg" alt="" aria-hidden="true">

      <div class="home__content">
        <h1 class="home__title" id="home-title"><img src="assets/hi-hot-stuff.svg" alt="Hi Hot Stuff"></h1>
        <p class="home__sub">We’re cooking something up.<br>But first, we want to hear from you.</p>
        <button class="start-btn" id="start-btn" type="button">
          <img src="assets/button.svg" alt="Start survey">
        </button>
      </div>
    </section>

    <!-- SURVEY -->
    <section class="view view--survey" id="survey" aria-live="polite">
      <form class="survey__card" id="card" novalidate></form>
      <nav class="dots" id="dots" aria-label="Survey progress"></nav>
    </section>

    <!-- THANK YOU -->
    <section class="view view--done" id="done">
      <img class="deco deco--chillies" src="assets/survey-2.svg" alt="" aria-hidden="true">
      <img class="deco deco--tomatoes" src="assets/survey-5.svg" alt="" aria-hidden="true">
      <div class="done__content">
        <h2 class="done__title">Thank you,<br><span id="done-name">hot stuff</span></h2>
        <p class="home__sub">Your answers are in the jar.<br>We’ll let you know when it’s ready.</p>
      </div>
    </section>

  </main>

  <script src="config.js"></script>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
